[project]
name = "jmunch-mcp"
version = "0.2.3"
description = "Transparent MCP proxy that reduces token cost of large tool responses via content-aware handles"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "J. Gravelle", email = "j@gravelle.us" },
]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
gateway = ["aiohttp>=3.9"]
exact-tokens = ["tiktoken>=0.7"]

[project.urls]
Homepage = "https://github.com/jgravelle/jmunch-mcp"
Repository = "https://github.com/jgravelle/jmunch-mcp"

[project.scripts]
jmunch-mcp = "jmunch_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ⚠⚠ Hatchling builds from the WORKING TREE, not from HEAD. Without this block
# the sdist falls back to hatchling's default selection, which is an implicit
# boundary: it happens to honor .gitignore, so nothing but .gitignore was
# keeping scratch files and local credential overrides out of published
# artifacts. An allowlist inverts that — anything new is OUT until named here.
# The excludes are defense in depth for the credential-shaped paths, so removing
# a .gitignore line cannot silently put them back. See RELEASING.md.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/bench",
    "/configs",
    "/examples",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]
exclude = [
    "**/*.local.toml",
    "**/*.bak-*",
    "**/.env",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jmunch_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/jmunch_mcp/cli/dashboard.html" = "jmunch_mcp/cli/dashboard.html"
